name: Nonbio hazard boundary audit
on:
  push:
    branches: [nonbiological-fire-verifier]
    paths:
      - "analysis/nonbio_hazard_boundary.py"
      - ".github/workflows/nonbio-hazard-boundary.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow duckdb
      - run: python analysis/nonbio_hazard_boundary.py
      - uses: actions/upload-artifact@v4
        with:
          name: nonbio-hazard-boundary
          path: audit_outputs/nonbio_hazard_boundary/
