name: Nested hurricane local impact rescue

on:
  push:
    branches:
      - experiment/mission-composition-20260829
    paths:
      - 'nested_hurricane_local_impact_rescue.py'
      - '.github/workflows/nested-hurricane-local-impact-rescue.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl scikit-learn requests catboost
      - name: Run nested hurricane local-impact rescue
        run: python nested_hurricane_local_impact_rescue.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: nested-hurricane-local-impact-rescue-results
          path: nested_hurricane_local_impact_rescue_results/
          retention-days: 30
