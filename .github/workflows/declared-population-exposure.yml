name: Declared population exposure router

on:
  push:
    branches:
      - experiment/mission-composition-20260829
    paths:
      - 'declared_population_exposure_router_experiment.py'
      - '.github/workflows/declared-population-exposure.yml'
  workflow_dispatch:

jobs:
  exposure-router:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl scikit-learn catboost
      - name: Restore frozen MissionAssignments snapshot
        uses: actions/cache@v4
        with:
          path: mission_composition_results/MissionAssignments_v2.jsonl
          key: mission-assignments-openfema-snapshot-20260901-v1
      - name: Run declared population exposure router experiment
        run: python declared_population_exposure_router_experiment.py
      - name: Upload declared population exposure results
        uses: actions/upload-artifact@v4
        with:
          name: declared-population-exposure-router-results
          path: declared_population_exposure_router_results/
          retention-days: 30
