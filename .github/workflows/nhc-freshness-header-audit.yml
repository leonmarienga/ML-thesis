name: NHC 123-case freshness and header audit
on:
  push:
    branches: [experiment/tropical-decision-time-recency-20261101]
    paths: ['analysis/nhc_advisory_freshness_and_header_audit.py','.github/workflows/nhc-freshness-header-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: experiment/tropical-decision-time-recency-20261101}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy requests beautifulsoup4
      - name: Get immutable existing 123-case source archive
        run: |
          mkdir -p audit_inputs/tropical_recency
          gh run download 41334493058 -n tropical-incident-year-matched-advisories -D audit_inputs/tropical_recency
          cd audit_inputs/tropical_recency
          zip -q tropical-incident-year-matched-advisories.zip *.csv *.json
      - run: python analysis/nhc_advisory_freshness_and_header_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tropical-freshness-header-audit
          path: audit_outputs/tropical_decision_time_recency/
          retention-days: 90
