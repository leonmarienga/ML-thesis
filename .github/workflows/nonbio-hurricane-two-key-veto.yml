name: Nonbio Hurricane two-key veto audit

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/nonbio_hurricane_two_key_veto.py"
      - ".github/workflows/nonbio-hurricane-two-key-veto.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow duckdb
      - name: Run Hurricane two-key veto audit
        run: python analysis/nonbio_hurricane_two_key_veto.py
      - uses: actions/upload-artifact@v4
        with:
          name: nonbio-hurricane-two-key-veto
          path: audit_outputs/nonbio_hurricane_two_key_veto/
