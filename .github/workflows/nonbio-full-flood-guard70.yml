name: Nonbio full Flood guard70 integration audit

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/nonbio_full_flood_guard70.py"
      - ".github/workflows/nonbio-full-flood-guard70.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow duckdb
      - name: Run full Flood guard70 integration
        run: python analysis/nonbio_full_flood_guard70.py
      - uses: actions/upload-artifact@v4
        with:
          name: nonbio-full-flood-guard70
          path: audit_outputs/nonbio_full_flood_guard70/
