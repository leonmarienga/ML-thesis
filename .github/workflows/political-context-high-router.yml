name: Political context high router

on:
  push:
    branches:
      - experiment/mission-composition-20260829
    paths:
      - 'political_context_high_router_experiment.py'
      - '.github/workflows/political-context-high-router.yml'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl scikit-learn catboost requests scipy
      - name: Run political context experiment
        run: python political_context_high_router_experiment.py
      - name: Upload political context results
        uses: actions/upload-artifact@v4
        with:
          name: political-context-high-router-results
          path: political_context_high_router_results/
          retention-days: 30
