name: Storm-relative hurricane audit

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/storm_relative_hurricane.py"
      - ".github/workflows/storm-relative-hurricane.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow
      - name: Run storm-relative hurricane audit
        run: python analysis/storm_relative_hurricane.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: storm-relative-hurricane
          path: audit_outputs/storm_relative_hurricane/
