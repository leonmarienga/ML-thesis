name: Nonbio 830 IA impact high-band diagnostic

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/nonbio_830_ia_impact_highband_diagnostic.py"
      - ".github/workflows/nonbio-830-ia-impact-highband-diagnostic.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - name: Download accepted 830 artifact
        run: |
          mkdir -p audit_inputs/post830_ia_impact/accepted
          gh run download 34701792537 \
            -n nonbio-829-hurricane-amendment-floor \
            -D audit_inputs/post830_ia_impact/accepted
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy requests openpyxl
      - name: Run post-830 IA impact high-band diagnostic
        run: python analysis/nonbio_830_ia_impact_highband_diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: nonbio-830-ia-impact-highband-diagnostic
          path: audit_outputs/nonbio_830_ia_impact_highband_diagnostic/
