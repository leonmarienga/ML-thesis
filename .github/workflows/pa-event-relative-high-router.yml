name: PA event-relative high router

on:
  push:
    branches:
      - experiment/mission-composition-20260829
    paths:
      - 'pa_event_relative_high_router_experiment.py'
      - '.github/workflows/pa-event-relative-high-router.yml'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl scikit-learn
      - name: Run event-relative PA high router screen
        run: python pa_event_relative_high_router_experiment.py
      - name: Upload event-relative PA results
        uses: actions/upload-artifact@v4
        with:
          name: pa-event-relative-high-router-results
          path: pa_event_relative_high_router_results/
          retention-days: 30
