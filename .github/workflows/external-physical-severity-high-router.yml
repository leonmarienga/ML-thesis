name: External physical severity high router

on:
  push:
    branches:
      - experiment/mission-composition-20260829
    paths:
      - 'external_physical_severity_high_router_experiment.py'
      - '.github/workflows/external-physical-severity-high-router.yml'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl scikit-learn catboost requests
      - name: Run external physical severity high router screen
        run: python external_physical_severity_high_router_experiment.py
      - name: Upload external physical severity results
        uses: actions/upload-artifact@v4
        with:
          name: external-physical-severity-high-router-results
          path: external_physical_severity_high_router_results/
          retention-days: 30
