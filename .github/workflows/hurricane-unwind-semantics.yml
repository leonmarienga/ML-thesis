name: Hurricane unwind semantics audit

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/hurricane_unwind_semantics.py"
      - ".github/workflows/hurricane-unwind-semantics.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl
      - name: Run unwind semantics audit
        run: python analysis/hurricane_unwind_semantics.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hurricane-unwind-semantics
          path: audit_outputs/hurricane_unwind_semantics/
