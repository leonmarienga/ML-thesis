name: Hurricane mission text specialist

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/hurricane_text_specialist.py"
      - ".github/workflows/hurricane-text-specialist.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl
      - name: Run hurricane text specialist
        run: python analysis/hurricane_text_specialist.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hurricane-text-specialist
          path: audit_outputs/hurricane_text_specialist/
