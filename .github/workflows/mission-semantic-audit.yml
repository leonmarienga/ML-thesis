name: Mission semantic audit

on:
  push:
    branches:
      - mission-semantic-audit
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mission-semantic-audit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl

      - name: Run audit
        run: python analysis/mission_semantic_audit.py

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: mission-semantic-audit
          path: audit_outputs/mission_semantic/
