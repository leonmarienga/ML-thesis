name: Full multi-direction high router ensemble

on:
  push:
    branches:
      - experiment/mission-composition-20260829
    paths:
      - 'multi_direction_high_router_ensemble_all.py'
      - '.github/workflows/multi-direction-high-router-ensemble-all.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl scikit-learn requests catboost
      - name: Run full multi-direction router ensemble
        run: python multi_direction_high_router_ensemble_all.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: multi-direction-high-router-ensemble-all-results
          path: multi_direction_high_router_ensemble_all_results/
          retention-days: 30
