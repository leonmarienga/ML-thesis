name: Nonbio 1M regression cutoff audit

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/nonbio_1m_regression_cutoff.py"
      - ".github/workflows/nonbio-1m-regression-cutoff.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl duckdb
      - name: Run predicted-dollar cutoff calibration
        run: python analysis/nonbio_1m_regression_cutoff.py
      - uses: actions/upload-artifact@v4
        with:
          name: nonbio-1m-regression-cutoff
          path: audit_outputs/nonbio_1m_regression_cutoff/
