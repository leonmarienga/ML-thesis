name: Nonbio final 830 accepted amount stack

on:
  push:
    branches: [nonbiological-fire-verifier]
    paths:
      - 'analysis/nonbio_final_830_accepted_amount_stack.py'
      - '.github/workflows/nonbio-final-830-accepted-amount-stack.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier

      - name: Download frozen 830 router artifact
        run: |
          mkdir -p audit_inputs/final_accepted_amount_stack/accepted
          gh run download 34701792537 \
            -n nonbio-829-hurricane-amendment-floor \
            -D audit_inputs/final_accepted_amount_stack/accepted
          test -f audit_inputs/final_accepted_amount_stack/accepted/candidate_predictions.csv

      - name: Restore preserved high-value specialist implementation
        run: |
          curl -L --fail \
            https://raw.githubusercontent.com/leonmarienga/ML-thesis/experiment/mission-composition-20260829/temporal_event_hierarchical_specialist_v2_experiment.py \
            -o analysis/legacy_tempv2.py
          curl -L --fail \
            https://raw.githubusercontent.com/leonmarienga/ML-thesis/experiment/mission-composition-20260829/frozen_declaration_scale_features.csv \
            -o frozen_declaration_scale_features.csv

      - name: Restore frozen mission-composition features
        run: |
          gh run download 33973053911 \
            -n mission-composition-results \
            -D mission_composition_results
          test -f mission_composition_results/mission_composition_features.csv

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl scikit-learn duckdb lightgbm catboost

      - name: Run final accepted amount stack
        run: python analysis/nonbio_final_830_accepted_amount_stack.py

      - uses: actions/upload-artifact@v4
        with:
          name: nonbio-final-830-accepted-amount-stack
          path: audit_outputs/nonbio_final_830_accepted_amount_stack/
          retention-days: 90
