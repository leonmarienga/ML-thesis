name: Nonbio Severe Storm second semantic key audit

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/nonbio_storm_second_semantic_key.py"
      - ".github/workflows/nonbio-storm-second-semantic-key.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl duckdb
      - name: Run Severe Storm second semantic key audit
        run: python analysis/nonbio_storm_second_semantic_key.py
      - uses: actions/upload-artifact@v4
        with:
          name: nonbio-storm-second-semantic-key
          path: audit_outputs/nonbio_storm_second_semantic_key/
