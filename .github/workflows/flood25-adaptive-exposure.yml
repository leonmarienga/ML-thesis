name: Phase25 duration-adaptive rainfall and county proxy ablation
on:
  push:
    branches: [experiment/flood-hurricane-physical-20261101]
    paths: ['analysis/flood25_duration_adaptive_exposure_ablation.py','.github/workflows/flood25-adaptive-exposure.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: experiment/flood-hurricane-physical-20261101}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scikit-learn requests openpyxl
      - run: |
          mkdir -p audit_inputs/flood25_adaptive/{single,multi,flow,exposure}
          gh run download 41410421735 -n daymet-all-87-flood-rainfall -D audit_inputs/flood25_adaptive/single
          gh run download 41411613949 -n flood92-multilocation-daymet -D audit_inputs/flood25_adaptive/multi
          gh run download 41406256247 -n flood57-stratified-seasonal-anomalies -D audit_inputs/flood25_adaptive/flow
          gh run download 41326254945 -n county-exposure-hazard-pilot -D audit_inputs/flood25_adaptive/exposure
      - run: python analysis/flood25_duration_adaptive_exposure_ablation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flood25-duration-adaptive-exposure
          path: audit_outputs/flood25_adaptive/
          retention-days: 90
