name: Mega mission gate

on:
  push:
    branches:
      - external-severity-ablation
    paths:
      - "analysis/mega_mission_gate.py"
      - ".github/workflows/mega-mission-gate.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: external-severity-ablation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow
      - name: Run mega mission gate
        run: python analysis/mega_mission_gate.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mega-mission-gate
          path: audit_outputs/mega_mission_gate/
