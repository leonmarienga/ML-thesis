name: All tropical NHC as-of exposure audit
on:
  push:
    branches: [experiment/all-tropical-asof-20261101]
    paths: ['analysis/nhc_all_tropical_asof.py','.github/workflows/nhc-all-tropical-asof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {ref: experiment/all-tropical-asof-20261101}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy openpyxl requests beautifulsoup4
      - run: python analysis/nhc_all_tropical_asof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-tropical-asof-coverage-audit
          path: audit_outputs/nhc_asof_all_tropical/
          retention-days: 90
