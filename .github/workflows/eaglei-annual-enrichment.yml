name: EAGLE-I annual enrichment

on:
  push:
    branches:
      - external-severity-ablation
    paths:
      - "analysis/eaglei_annual_enrichment.py"
      - ".github/workflows/eaglei-annual-enrichment.yml"
  workflow_dispatch:

jobs:
  annual:
    strategy:
      fail-fast: false
      matrix:
        year: [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EAGLE_YEAR: ${{ matrix.year }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: external-severity-ablation

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl

      - name: Run annual EAGLE-I enrichment
        run: python analysis/eaglei_annual_enrichment.py

      - name: Upload annual artifact
        uses: actions/upload-artifact@v4
        with:
          name: eaglei-${{ matrix.year }}
          path: audit_outputs/eaglei_annual/${{ matrix.year }}/
