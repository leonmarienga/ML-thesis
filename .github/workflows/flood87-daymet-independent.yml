name: Daymet all 87 geolocated flood rainfall
on:
  push:
    branches: [experiment/flood-hurricane-physical-20261101]
    paths: ['analysis/flood87_daymet_independent_rainfall.py','.github/workflows/flood87-daymet-independent.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: experiment/flood-hurricane-physical-20261101}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy requests openpyxl
      - run: |
          mkdir -p audit_inputs/daymet_flood87/{noaa,county}
          gh run download 34017327286 -n external-severity-ablation -D audit_inputs/daymet_flood87/noaa
          gh run download 41326254945 -n county-exposure-hazard-pilot -D audit_inputs/daymet_flood87/county
          cp audit_inputs/daymet_flood87/noaa/external_match_audit.csv audit_inputs/daymet_flood87/external_match_audit.csv
          cp audit_inputs/daymet_flood87/county/event_county_census_matches.csv audit_inputs/daymet_flood87/event_county_census_matches.csv
      - run: python analysis/flood87_daymet_independent_rainfall.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daymet-all-87-flood-rainfall
          path: audit_outputs/daymet_flood87/
          retention-days: 90
