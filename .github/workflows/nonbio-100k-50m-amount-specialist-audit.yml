name: Nonbio 100K-50M amount specialist audit

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - 'analysis/nonbio_100k_50m_amount_specialist_audit.py'
      - '.github/workflows/nonbio-100k-50m-amount-specialist-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl scikit-learn
      - name: Run strict LFYO amount audit
        run: python analysis/nonbio_100k_50m_amount_specialist_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: nonbio-100k-50m-amount-specialist-audit
          path: audit_outputs/nonbio_100k_50m_amount_specialist_audit/
          retention-days: 90
