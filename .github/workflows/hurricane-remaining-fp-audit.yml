name: Hurricane remaining FP mechanism audit

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/hurricane_remaining_fp_audit.py"
      - ".github/workflows/hurricane-remaining-fp-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow duckdb
      - name: Run remaining Hurricane FP audit
        run: python analysis/hurricane_remaining_fp_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: hurricane-remaining-fp-audit
          path: audit_outputs/hurricane_remaining_fp_audit/
