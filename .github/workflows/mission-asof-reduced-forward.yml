name: Reduced Feature Mission T0 Forward Compare
on:
  push:
    branches: [experiment/mission-asof-snapshots-20261101]
    paths: ['analysis/mission_asof_reduced_forward_compare.py','.github/workflows/mission-asof-reduced-forward.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: experiment/mission-asof-snapshots-20261101}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy scikit-learn openpyxl
      - name: Download frozen and t0 feature outputs
        run: |
          mkdir -p audit_inputs/mission_asof_compare/{mission,tropical,frozen}
          gh run download 41340860069 -n mission-action-asof-t0-t72-971 -D audit_inputs/mission_asof_compare/mission
          gh run download 41334493058 -n tropical-incident-year-matched-advisories -D audit_inputs/mission_asof_compare/tropical
          gh run download 34701792537 -n nonbio-829-hurricane-amendment-floor -D audit_inputs/mission_asof_compare/frozen
      - run: python analysis/mission_asof_reduced_forward_compare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-asof-reduced-forward-comparison
          path: audit_outputs/mission_asof_compare/
          retention-days: 90
