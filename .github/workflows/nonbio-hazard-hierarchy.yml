name: Nonbio hazard hierarchy

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/nonbio_hazard_hierarchy.py"
      - ".github/workflows/nonbio-hazard-hierarchy.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow
      - name: Run hierarchy audit
        run: python analysis/nonbio_hazard_hierarchy.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nonbio-hazard-hierarchy
          path: audit_outputs/nonbio_hazard_hierarchy/
