name: Fast no-scale feature engineering high router

on:
  push:
    branches:
      - experiment/mission-composition-20260829
    paths:
      - 'systematic_feature_engineering_high_router_fast_noscale.py'
      - '.github/workflows/systematic-feature-engineering-high-router-fast-noscale.yml'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl scikit-learn catboost
      - name: Run fast no-scale feature engineering screen
        run: python systematic_feature_engineering_high_router_fast_noscale.py
      - name: Upload fast no-scale feature engineering results
        uses: actions/upload-artifact@v4
        with:
          name: systematic-feature-engineering-high-router-fast-noscale-results
          path: systematic_feature_engineering_high_router_fast_noscale_results/
          retention-days: 30
