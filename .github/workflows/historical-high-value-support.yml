name: Historical high-value support audit

on:
  push:
    branches:
      - experiment/mission-composition-20260829
    paths:
      - 'historical_high_value_support_audit.py'
      - '.github/workflows/historical-high-value-support.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl
      - name: Restore frozen 2010-2024 MissionAssignments snapshot
        uses: actions/cache@v4
        with:
          path: mission_composition_results/MissionAssignments_v2.jsonl
          key: mission-assignments-openfema-snapshot-20260901-v1
      - name: Run historical high-value support audit
        run: python historical_high_value_support_audit.py
      - name: Upload historical support audit
        uses: actions/upload-artifact@v4
        with:
          name: historical-high-value-support-results
          path: historical_high_value_support_results/
          retention-days: 30
