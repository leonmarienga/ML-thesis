name: NOAA physical severity signal audit

on:
  push:
    branches:
      - experiment/mission-composition-20260829
    paths:
      - 'noaa_physical_severity_signal_audit.py'
      - '.github/workflows/noaa-physical-severity-signal-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl scipy requests
      - name: Run NOAA physical severity audit
        run: python noaa_physical_severity_signal_audit.py
      - name: Upload NOAA severity audit results
        uses: actions/upload-artifact@v4
        with:
          name: noaa-physical-severity-signal-audit-results
          path: noaa_physical_severity_signal_audit_results/
          retention-days: 30
