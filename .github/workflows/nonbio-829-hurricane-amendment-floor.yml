name: Nonbio 829 Hurricane amendment floor

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/nonbio_829_hurricane_amendment_floor.py"
      - ".github/workflows/nonbio-829-hurricane-amendment-floor.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - name: Download accepted 829 artifact
        run: |
          mkdir -p audit_inputs/post829_hurricane_amendment/accepted
          gh run download 34701180075 \
            -n nonbio-827-hurricane-zero-mission-prereq \
            -D audit_inputs/post829_hurricane_amendment/accepted
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy scipy scikit-learn requests openpyxl duckdb
      - name: Run post-829 Hurricane amendment floor audit
        run: python analysis/nonbio_829_hurricane_amendment_floor.py
      - uses: actions/upload-artifact@v4
        with:
          name: nonbio-829-hurricane-amendment-floor
          path: audit_outputs/nonbio_829_hurricane_amendment_floor/
