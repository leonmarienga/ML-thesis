name: Nonbio low threshold calibration

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/nonbio_low_thresholds.py"
      - ".github/workflows/nonbio-low-thresholds.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow duckdb
      - name: Run threshold-calibrated low audit
        run: python analysis/nonbio_low_thresholds.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nonbio-low-thresholds
          path: audit_outputs/nonbio_low_thresholds/
