name: CDC biological severity signal audit

on:
  push:
    branches:
      - experiment/mission-composition-20260829
    paths:
      - 'cdc_biological_severity_signal_audit.py'
      - '.github/workflows/cdc-biological-severity-signal-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl scipy requests
      - name: Run CDC biological severity audit
        run: python cdc_biological_severity_signal_audit.py
      - name: Upload CDC severity audit results
        uses: actions/upload-artifact@v4
        with:
          name: cdc-biological-severity-signal-audit-results
          path: cdc_biological_severity_signal_audit_results/
          retention-days: 30
