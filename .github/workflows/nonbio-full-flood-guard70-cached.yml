name: Nonbio full Flood guard70 cached confirm

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/nonbio_full_flood_guard70_cached.py"
      - "analysis/cache/flood_guard70_strict_thresholds.csv"
      - ".github/workflows/nonbio-full-flood-guard70-cached.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow duckdb
      - name: Run cached Flood guard70 confirmation
        run: python analysis/nonbio_full_flood_guard70_cached.py
      - uses: actions/upload-artifact@v4
        with:
          name: nonbio-full-flood-guard70-cached
          path: audit_outputs/nonbio_full_flood_guard70_cached/
