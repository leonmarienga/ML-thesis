name: Nonbio sentinel consensus audit

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/nonbio_sentinel_consensus.py"
      - ".github/workflows/nonbio-sentinel-consensus.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow duckdb
      - name: Run sentinel consensus audit
        run: python analysis/nonbio_sentinel_consensus.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nonbio-sentinel-consensus
          path: audit_outputs/nonbio_sentinel_consensus/
