name: Fast cross-hazard event growth router

on:
  push:
    branches:
      - experiment/mission-composition-20260829
    paths:
      - 'generic_event_growth_high_router_fast.py'
      - '.github/workflows/generic-event-growth-high-router-fast.yml'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl scikit-learn catboost requests scipy
      - name: Run event-growth screen
        run: python generic_event_growth_high_router_fast.py
      - name: Upload event-growth results
        uses: actions/upload-artifact@v4
        with:
          name: generic-event-growth-high-router-fast-results
          path: generic_event_growth_high_router_fast_results/
          retention-days: 30
