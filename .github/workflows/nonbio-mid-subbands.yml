name: Nonbio internal mid-band audit

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/nonbio_mid_subbands.py"
      - ".github/workflows/nonbio-mid-subbands.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow duckdb
      - name: Run internal mid-band audit
        run: python analysis/nonbio_mid_subbands.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nonbio-mid-subbands
          path: audit_outputs/nonbio_mid_subbands/
