name: NHC high-value as-of archive audit
on:
  push:
    branches: [experiment/nhc-asof-advisories-20261101]
    paths:
      - 'analysis/nhc_asof_highband_fast.py'
      - '.github/workflows/nhc-asof-highband-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/nhc-asof-advisories-20261101
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy openpyxl requests beautifulsoup4
      - run: python analysis/nhc_asof_highband_fast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhc-asof-highband-feature-audit
          path: audit_outputs/nhc_asof_highband/
