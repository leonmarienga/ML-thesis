name: Phase50 temporal placebo reproducibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    if: startsWith(github.ref_name, 'experiment/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-research.txt
      - run: python -m unittest discover -s analysis -p test_phase50_temporal_placebo.py
      - run: python analysis/phase50_temporal_placebo.py --offline-inputs research/phase50 --out work/phase50-reproduced
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase50-temporal-placebo-reproduced
          path: work/phase50-reproduced/
          retention-days: 90
