name: Nonbio full-range router audit

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/nonbio_all_ranges.py"
      - ".github/workflows/nonbio-all-ranges.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow duckdb
      - name: Run full-range router audit
        run: python analysis/nonbio_all_ranges.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nonbio-all-ranges
          path: audit_outputs/nonbio_all_ranges/
