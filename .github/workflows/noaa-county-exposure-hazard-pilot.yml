name: NOAA County Exposure Hazard Pilot
on:
  push:
    branches: [experiment/physical-severity-pilot-20261101]
    paths:
      - 'analysis/nonbio_county_exposure_hazard_pilot.py'
      - '.github/workflows/noaa-county-exposure-hazard-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/physical-severity-pilot-20261101
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn openpyxl requests
      - name: Download immutable external severity and frozen router
        run: |
          mkdir -p audit_inputs/county_exposure_hazard/{external,frozen}
          gh run download 34017327286 -n external-severity-ablation -D audit_inputs/county_exposure_hazard/external
          gh run download 34701792537 -n nonbio-829-hurricane-amendment-floor -D audit_inputs/county_exposure_hazard/frozen
      - name: Run county population and hazard-aware experimental audit
        run: python analysis/nonbio_county_exposure_hazard_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: county-exposure-hazard-pilot
          path: audit_outputs/county_exposure_hazard/
          retention-days: 90
