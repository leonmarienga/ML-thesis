name: Nonbio recall-first root audit

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/nonbio_root_recall.py"
      - ".github/workflows/nonbio-root-recall.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow duckdb
      - name: Run recall-first root audit
        run: python analysis/nonbio_root_recall.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nonbio-root-recall
          path: audit_outputs/nonbio_root_recall/
