name: Replay continuous thesis batches
on:
  push:
    branches: [experiment/thesis-research-continuation-20261117]
    paths:
      - 'analysis/thesis_historical_coverage.py'
      - 'analysis/thesis_precoverage_ablation.py'
      - 'analysis/thesis_earthquake_auxiliary.py'
      - 'analysis/thesis_declaration_publication.py'
      - 'analysis/thesis_earthquake_impact_audit.py'
      - 'analysis/thesis_obligation_horizon_audit.py'
      - 'analysis/thesis_water_recourse.py'
      - 'analysis/thesis_whitehouse_announcements.py'
      - 'analysis/thesis_tropical_wind_verification.py'
      - 'analysis/thesis_announcement_fields.py'
      - 'analysis/thesis_full_page_geography.py'
      - 'analysis/thesis_full_geography_ablation.py'
      - 'analysis/thesis_older_announcement_archive.py'
      - 'analysis/thesis_disturbance_duration.py'
      - 'analysis/thesis_documentary_support.py'
      - 'analysis/thesis_outage_observability.py'
      - 'analysis/thesis_precoverage_documentary.py'
      - 'analysis/thesis_sustained_outage_transfer.py'
      - 'analysis/thesis_component_accounting.py'
      - 'analysis/thesis_county_wind_exposure.py'
      - 'analysis/thesis_storm_outage_panel.py'
      - 'analysis/thesis_public_ledger_gate.py'
      - 'analysis/thesis_humanitarian_source_gate.py'
      - 'research/requirements.txt'
      - 'research/continuous/**'
      - '.github/workflows/thesis-continuous-batches.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_CORETYPE: Haswell
      NPY_DISABLE_CPU_FEATURES: X86_V4,AVX512_ICL,AVX512_SPR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: python -m pip install -r research/requirements.txt
      - name: Verify frozen historical and target-free inputs
        run: |
          git diff --exit-code ebad27b HEAD -- research/results research/inputs research/follow_up research/augmentation master_openfema_40plus.xlsx
          sha256sum -c research/continuous/coverage/inputs/SHA256SUMS
          sha256sum -c research/continuous/earthquake/inputs/SHA256SUMS
      - name: Reproduce historical coverage and PGA transfer
        run: |
          mkdir -p work/batch1/{openfema,usgs,coverage,ablation,pga-input,pga}
          tar xf research/continuous/coverage/inputs/openfema_public_responses.tar.gz -C work/batch1/openfema
          tar xf research/continuous/earthquake/inputs/usgs_public_responses.tar.gz -C work/batch1/usgs
          python analysis/thesis_historical_coverage.py work/batch1/openfema work/batch1/coverage
          python analysis/thesis_precoverage_ablation.py work/batch1/ablation
          python analysis/thesis_earthquake_auxiliary.py work/batch1/pga-input work/batch1/pga --fetch work/batch1/usgs
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          expected = Path("research/continuous")
          for source, dest in [("coverage", "coverage/audit"), ("ablation", "coverage/ablation"),
                               ("pga-input", "earthquake/inputs"), ("pga", "earthquake/results")]:
              for generated in sorted((Path("work/batch1") / source).iterdir()):
                  pd.testing.assert_frame_equal(pd.read_csv(generated), pd.read_csv(expected / dest / generated.name),
                                                check_exact=False, rtol=1e-6, atol=1e-6)
          PY
      - name: Replay publication timing and earthquake impact linkage
        run: |
          sha256sum -c research/continuous/BATCH2_SHA256SUMS
          mkdir -p work/batch2/{filing-snapshot,impact-snapshot,filings,impacts}
          tar xf research/continuous/filings/inputs/federal_register_public_responses.tar.gz -C work/batch2/filing-snapshot
          tar xf research/continuous/impacts/inputs/noaa_impact_public_responses.tar.gz -C work/batch2/impact-snapshot
          python analysis/thesis_declaration_publication.py work/batch2/filing-snapshot work/batch2/filings
          python analysis/thesis_earthquake_impact_audit.py work/batch2/impact-snapshot work/batch2/impacts
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          for scope in ("filings", "impacts"):
              for generated in sorted((Path("work/batch2") / scope).iterdir()):
                  expected = Path("research/continuous") / scope / "results" / generated.name
                  pd.testing.assert_frame_equal(pd.read_csv(generated), pd.read_csv(expected),
                                                check_exact=False, rtol=1e-6, atol=1e-6)
          PY
      - name: Replay signed obligation horizons and water recourse
        run: |
          sha256sum -c research/continuous/horizons/inputs/SHA256SUMS
          mkdir -p work/batch3/{snapshot,horizons,water_recourse}
          tar xf research/continuous/horizons/inputs/historical_mission_actions_responses.tar.gz -C work/batch3/snapshot
          python analysis/thesis_obligation_horizon_audit.py work/batch3/snapshot work/batch3/horizons
          python analysis/thesis_water_recourse.py work/batch3/water_recourse
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          for scope in ("horizons", "water_recourse"):
              for generated in sorted((Path("work/batch3") / scope).iterdir()):
                  expected = Path("research/continuous") / scope / "results" / generated.name
                  reader = pd.read_json if generated.name.endswith(".jsonl.gz") else pd.read_csv
                  args = {"lines": True} if reader is pd.read_json else {}
                  pd.testing.assert_frame_equal(reader(generated, **args), reader(expected, **args),
                                                check_exact=False, rtol=1e-6, atol=1e-6)
          PY
      - name: Replay announcement publication and operational wind
        run: |
          sha256sum -c research/continuous/BATCH4_SHA256SUMS
          mkdir -p work/batch4/{announcements-source,winds-source,announcements,winds}
          tar xf research/continuous/announcements/inputs/nara_public_html_responses.tar.gz -C work/batch4/announcements-source
          tar xf research/continuous/winds/inputs/noaa_public_wind_responses.tar.gz -C work/batch4/winds-source
          python analysis/thesis_whitehouse_announcements.py work/batch4/announcements-source work/batch4/announcements
          python analysis/thesis_tropical_wind_verification.py work/batch4/winds-source work/batch4/winds
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          for scope in ("announcements", "winds"):
              for generated in sorted((Path("work/batch4") / scope).iterdir()):
                  expected = Path("research/continuous") / scope / "results" / generated.name
                  pd.testing.assert_frame_equal(pd.read_csv(generated), pd.read_csv(expected),
                                                check_exact=False, rtol=1e-6, atol=1e-6)
          PY
      - name: Replay complete geography, early fields and independent tropical wind
        run: |
          sha256sum -c research/continuous/BATCH5_SHA256SUMS
          mkdir -p work/batch5/{dds,wind-source,complete_geography,announcement_fields,wind_extension,ablation}
          tar xf research/continuous/complete_geography/inputs/openfema_all_36_verified_pages.tar.gz -C work/batch5/dds
          tar xf research/continuous/wind_extension/inputs/noaa_additional_wind_responses.tar.gz -C work/batch5/wind-source
          python analysis/thesis_full_page_geography.py work/batch5/dds work/batch5/complete_geography
          python analysis/thesis_announcement_fields.py work/batch4/announcements-source work/batch5/announcement_fields
          python analysis/thesis_tropical_wind_verification.py work/batch5/wind-source work/batch5/wind_extension --independent-extension
          python analysis/thesis_full_geography_ablation.py research/continuous/complete_geography/hazard_replay/cohort_features.csv work/batch5/ablation
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          for scope in ("complete_geography", "announcement_fields", "wind_extension", "ablation"):
              for generated in sorted((Path("work/batch5") / scope).iterdir()):
                  ref = "complete_geography/ablation" if scope == "ablation" else f"{scope}/results"
                  expected = Path("research/continuous") / ref / generated.name
                  pd.testing.assert_frame_equal(pd.read_csv(generated), pd.read_csv(expected),
                                                check_exact=False, rtol=1e-6, atol=1e-6)
          PY
      - name: Replay earlier announcement vintages and disturbance duration priors
        run: |
          sha256sum -c research/continuous/BATCH6_SHA256SUMS
          mkdir -p work/batch6/{older-source,doe-source,older_announcements,disturbance_duration}
          tar xf research/continuous/older_announcements/inputs/older_announcement_responses.tar.gz -C work/batch6/older-source
          tar xf research/continuous/disturbance_duration/inputs/doe_annual_summaries.tar.gz -C work/batch6/doe-source
          python analysis/thesis_older_announcement_archive.py work/batch6/older-source work/batch6/older_announcements
          python analysis/thesis_disturbance_duration.py work/batch6/doe-source work/batch6/disturbance_duration
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          for scope in ("older_announcements", "disturbance_duration"):
              reference = Path("research/continuous") / scope / "results"
              replay = Path("work/batch6") / scope
              assert {file.name for file in reference.glob("*.csv")} == {file.name for file in replay.glob("*.csv")}
              for generated in sorted(replay.glob("*.csv")):
                  pd.testing.assert_frame_equal(pd.read_csv(generated), pd.read_csv(reference / generated.name),
                                                check_exact=False, rtol=1e-8, atol=1e-8)
          PY
      - name: Replay wider documentary and county outage support
        run: |
          sha256sum -c research/continuous/BATCH7_SHA256SUMS
          mkdir -p work/batch7/{older-source,outage-source,documentary_extension,county_outages}
          tar xf research/continuous/documentary_extension/inputs/extended_announcement_responses.tar.gz -C work/batch7/older-source
          tar xf research/continuous/county_outages/inputs/eaglei_and_mesa_evidence.tar.gz -C work/batch7/outage-source
          python analysis/thesis_older_announcement_archive.py work/batch7/older-source work/batch7/documentary_extension --extend-quarterly-sample
          python analysis/thesis_documentary_support.py work/batch7/documentary_extension/document_identity.csv work/batch7/documentary_extension
          python analysis/thesis_outage_observability.py work/batch7/outage-source work/batch7/county_outages
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          for scope in ("documentary_extension", "county_outages"):
              reference = Path("research/continuous") / scope / "results"
              replay = Path("work/batch7") / scope
              assert {file.name for file in reference.glob("*.csv")} == {file.name for file in replay.glob("*.csv")}
              for generated in sorted(replay.glob("*.csv")):
                  pd.testing.assert_frame_equal(pd.read_csv(generated), pd.read_csv(reference / generated.name),
                                                check_exact=False, rtol=1e-8, atol=1e-8)
          PY
      - name: Replay historical ledger documents and sustained outage transfer
        run: |
          if ! command -v pdftotext; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          sha256sum -c research/continuous/BATCH8_SHA256SUMS
          mkdir -p work/batch8/{document-source,outage-source,precoverage_documentary,sustained_outage,zero_sensitivity}
          tar xf research/continuous/precoverage_documentary/inputs/public_document_archive.tar.gz -C work/batch8/document-source
          tar xf research/continuous/sustained_outage/inputs/eaglei_annual_slice_archive.tar.gz -C work/batch8/outage-source
          cp work/batch7/outage-source/eaglei_2018_24_counties.csv.gz work/batch8/outage-source/
          cp work/batch7/outage-source/national_slice_manifest.json work/batch8/outage-source/slice_manifest_2018.json
          python analysis/thesis_precoverage_documentary.py work/batch8/document-source research/continuous/precoverage_documentary/inputs/curated_evidence.csv work/batch8/precoverage_documentary
          python analysis/thesis_sustained_outage_transfer.py work/batch8/outage-source work/batch8/sustained_outage
          python analysis/thesis_sustained_outage_transfer.py work/batch8/outage-source work/batch8/zero_sensitivity --exclude-zero-counts
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          reference = Path("research/continuous")
          for scope, dest in [("precoverage_documentary", "precoverage_documentary/results"),
                              ("sustained_outage", "sustained_outage/results"),
                              ("zero_sensitivity", "sustained_outage/zero_sensitivity")]:
              saved = reference / dest
              replay = Path("work/batch8") / scope
              assert {file.name for file in saved.glob("*.csv")} == {file.name for file in replay.glob("*.csv")}
              for generated in sorted(replay.glob("*.csv")):
                  pd.testing.assert_frame_equal(pd.read_csv(generated), pd.read_csv(saved / generated.name),
                                                check_exact=False, rtol=1e-6, atol=1e-6)
          PY
      - name: Replay component accounting and county wind exposure
        run: |
          sha256sum -c research/continuous/BATCH9_SHA256SUMS
          mkdir -p work/batch9/{component-source,wind-source,component_accounting,county_wind_exposure}
          tar xf research/continuous/component_accounting/inputs/public_component_reports.tar.gz -C work/batch9/component-source
          tar xf research/continuous/county_wind_exposure/inputs/census_2017_county_points.tar.gz -C work/batch9/wind-source
          tar xf research/continuous/winds/inputs/noaa_public_wind_responses.tar.gz -C work/batch9/wind-source ./aal132020.dat.gz ./aal132020.dat.gz.json ./aal092022.dat.gz ./aal092022.dat.gz.json
          tar xf research/continuous/wind_extension/inputs/noaa_additional_wind_responses.tar.gz -C work/batch9/wind-source ./aal142018.dat.gz ./aal142018.dat.gz.json ./aal102023.dat.gz ./aal102023.dat.gz.json
          python analysis/thesis_component_accounting.py work/batch9/component-source research/continuous/component_accounting/inputs/curated_records.csv work/batch9/component_accounting
          python analysis/thesis_county_wind_exposure.py work/batch9/wind-source work/batch9/county_wind_exposure
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          for scope in ("component_accounting", "county_wind_exposure"):
              saved = Path("research/continuous") / scope / "results"
              replay = Path("work/batch9") / scope
              assert {file.name for file in saved.glob("*.csv")} == {file.name for file in replay.glob("*.csv")}
              for generated in sorted(replay.glob("*.csv")):
                  pd.testing.assert_frame_equal(pd.read_csv(generated), pd.read_csv(saved / generated.name),
                                                check_exact=False, rtol=1e-7, atol=1e-7)
          PY
      - name: Replay exact legacy ledgers, the storm panel, and measured humanitarian sources
        run: |
          sha256sum -c research/continuous/BATCH10_SHA256SUMS
          mkdir -p work/batch10/{legacy-source,wind-source,storm-slices,survey-source,legacy,panel,primary,zero,needs}
          base=research/continuous
          tar xf "$base/legacy_ledger_gate/inputs/public_legacy_ledger_routes.tar.gz" -C work/batch10/legacy-source
          tar xf "$base/humanitarian_source/inputs/public_survey_and_shelter_sources.tar.gz" -C work/batch10/survey-source
          panel_root="$base/storm_outage_panel/inputs"
          for input in "$panel_root"/forecast_and_county_sources.tar.gz "$panel_root"/nhc_reports_*.tar.gz; do
            tar xf "$input" -C work/batch10/wind-source
          done
          tar xf "$panel_root/verified_eaglei_event_slices.tar.gz" -C work/batch10/storm-slices
          python analysis/thesis_public_ledger_gate.py work/batch10/legacy-source work/batch10/legacy
          python analysis/thesis_humanitarian_source_gate.py work/batch10/survey-source "$base/humanitarian_source/inputs/casper_extract.csv" work/batch10/needs
          python analysis/thesis_storm_outage_panel.py panel work/batch10/wind-source work/batch10/panel --tcr-markers "$panel_root/tcr_markers.json"
          python analysis/thesis_storm_outage_panel.py evaluate work/batch10/wind-source work/batch10/primary --slices work/batch10/storm-slices --panel "$panel_root/storm_county_panel.csv"
          python analysis/thesis_storm_outage_panel.py evaluate work/batch10/wind-source work/batch10/zero --slices work/batch10/storm-slices --panel "$panel_root/storm_county_panel.csv" --exclude-zeros
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          reference = Path("research/continuous")
          for scope, dest in [("legacy", "legacy_ledger_gate/results"), ("needs", "humanitarian_source/results"),
                              ("panel", "storm_outage_panel/inputs"), ("primary", "storm_outage_panel/results"),
                              ("zero", "storm_outage_panel/zero_sensitivity")]:
              saved = reference / dest
              replay = Path("work/batch10") / scope
              assert {file.name for file in saved.glob("*.csv")} == {file.name for file in replay.glob("*.csv")}
              for generated in sorted(replay.glob("*.csv")):
                  opts = {"dtype": {"fips_code": str}}
                  pd.testing.assert_frame_equal(pd.read_csv(generated, **opts), pd.read_csv(saved / generated.name, **opts),
                                                check_exact=False, rtol=1e-7, atol=1e-7)
          PY
