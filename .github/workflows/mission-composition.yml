name: Mission composition experiment

on:
  push:
    branches:
      - experiment/mission-composition-20260829
  workflow_dispatch:

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl scikit-learn xgboost lightgbm catboost

      - name: Restore frozen MissionAssignments snapshot
        uses: actions/cache@v4
        with:
          path: mission_composition_results/MissionAssignments_v2.jsonl
          key: mission-assignments-openfema-snapshot-20260901-v1

      - name: Run mission composition experiment
        run: python mission_composition_experiment.py
      - name: Run fine split regime experiment
        run: python fine_split_regime_experiment.py
      - name: Run nested high-value mixture-of-experts experiment
        run: python nested_high_value_moe_experiment.py
      - name: Run frozen boundary-weighted specialist benchmark
        run: python boundary_weighted_specialist_experiment.py
      - name: Run strict temporal hierarchical specialist benchmark
        run: python temporal_event_hierarchical_specialist_experiment.py
      - name: Run strict temporal hierarchical specialist v2 benchmark
        run: python temporal_event_hierarchical_specialist_v2_experiment.py
      - name: Run strict target-free router benchmark
        run: python target_free_router_experiment.py
      - name: Run full funding-range router benchmark
        run: python full_funding_range_router_experiment.py

      - name: Upload mission results
        uses: actions/upload-artifact@v4
        with:
          name: mission-composition-results
          path: mission_composition_results/
          retention-days: 30
      - name: Upload fine split regime results
        uses: actions/upload-artifact@v4
        with:
          name: fine-split-regime-results
          path: fine_split_regime_results/
          retention-days: 30
      - name: Upload nested high-value mixture results
        uses: actions/upload-artifact@v4
        with:
          name: nested-high-value-moe-results
          path: nested_high_value_moe_results/
          retention-days: 30
      - name: Upload boundary-weighted specialist benchmark
        uses: actions/upload-artifact@v4
        with:
          name: boundary-weighted-specialist-results
          path: boundary_weighted_specialist_results/
          retention-days: 30
      - name: Upload temporal hierarchical specialist benchmark
        uses: actions/upload-artifact@v4
        with:
          name: temporal-event-hierarchical-specialist-results
          path: temporal_event_hierarchical_specialist_results/
          retention-days: 30
      - name: Upload temporal hierarchical specialist v2 benchmark
        uses: actions/upload-artifact@v4
        with:
          name: temporal-event-hierarchical-specialist-v2-results
          path: temporal_event_hierarchical_specialist_v2_results/
          retention-days: 30
      - name: Upload target-free router benchmark
        uses: actions/upload-artifact@v4
        with:
          name: target-free-router-results
          path: target_free_router_results/
          retention-days: 30
      - name: Upload full funding-range router benchmark
        uses: actions/upload-artifact@v4
        with:
          name: full-funding-range-router-results
          path: full_funding_range_router_results/
          retention-days: 30
