name: Mission composition experiment

on:
  push:
    branches:
      - experiment/mission-composition-20260829
  workflow_dispatch:

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl scikit-learn xgboost lightgbm catboost
      - name: Run mission composition experiment
        run: python mission_composition_experiment.py
      - name: Run fast split regime experiment
        run: python split_regime_fast_experiment.py
      - name: Upload mission results
        uses: actions/upload-artifact@v4
        with:
          name: mission-composition-results
          path: mission_composition_results/
          retention-days: 30
      - name: Upload fast split regime results
        uses: actions/upload-artifact@v4
        with:
          name: split-regime-fast-results
          path: split_regime_fast_results/
          retention-days: 30
