name: Operational expansion audit

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/operational_expansion_audit.py"
      - ".github/workflows/operational-expansion-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow
      - name: Run operational expansion audit
        run: python analysis/operational_expansion_audit.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: operational-expansion-audit
          path: audit_outputs/operational_expansion/
