name: Recover documented nested high gates

on:
  push:
    branches:
      - experiment/mission-composition-20260829
    paths:
      - 'recover_documented_high_gates.py'
      - '.github/workflows/recover-documented-high-gates.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl scikit-learn requests catboost

      - name: Download archived exposure artifact
        uses: actions/download-artifact@v4
        with:
          name: declared-population-exposure-router-results
          path: recovered_gate_inputs/exposure
          github-token: ${{ github.token }}
          repository: leonmarienga/ML-thesis
          run-id: 33647372275

      - name: Download archived mission feature artifact
        uses: actions/download-artifact@v4
        with:
          name: mission-composition-results
          path: recovered_gate_inputs/mission
          github-token: ${{ github.token }}
          repository: leonmarienga/ML-thesis
          run-id: 33653305090

      - name: Run constrained nested recovery
        run: python recover_documented_high_gates.py

      - name: Upload recovered gate results
        uses: actions/upload-artifact@v4
        with:
          name: recovered-documented-high-gates-results
          path: recovered_documented_high_gates_results/
          retention-days: 30
