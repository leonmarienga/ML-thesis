name: Recover documented nested high gates

on:
  push:
    branches:
      - experiment/mission-composition-20260829
    paths:
      - 'recover_documented_high_gates.py'
      - '.github/workflows/recover-documented-high-gates.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl scikit-learn requests catboost
      - name: Prepare archived feature inputs
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          mkdir -p recovered_gate_inputs/exposure recovered_gate_inputs/mission
          curl -L -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/leonmarienga/ML-thesis/actions/artifacts/9853377265/zip \
            -o exposure.zip
          unzip -o exposure.zip -d recovered_gate_inputs/exposure
          curl -L -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/leonmarienga/ML-thesis/actions/artifacts/9856161191/zip \
            -o mission.zip
          unzip -o mission.zip -d recovered_gate_inputs/mission
      - name: Run constrained nested recovery
        run: python recover_documented_high_gates.py
      - name: Upload recovered gate results
        uses: actions/upload-artifact@v4
        with:
          name: recovered-documented-high-gates-results
          path: recovered_documented_high_gates_results/
          retention-days: 30
