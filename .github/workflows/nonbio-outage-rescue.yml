name: Nonbio EAGLE-I outage rescue

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/nonbio_outage_rescue.py"
      - ".github/workflows/nonbio-outage-rescue.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow duckdb
      - name: Run outage rescue audit
        run: python analysis/nonbio_outage_rescue.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nonbio-outage-rescue
          path: audit_outputs/nonbio_outage_rescue/
