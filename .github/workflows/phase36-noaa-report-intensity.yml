name: Phase36 NOAA reporting intensity sensitivity
on:
  push:
    branches: [experiment/noaa-storm-impact-20261102]
    paths: ['.github/workflows/phase36-noaa-report-intensity.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: experiment/noaa-storm-impact-20261102}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy openpyxl scikit-learn tabulate
      - run: |
          mkdir -p audit_inputs/phase36/phase25 audit_inputs/phase36/phase34 audit_inputs/phase36/phase35
          gh run download 41417102317 -n flood25-duration-adaptive-exposure -D audit_inputs/phase36/phase25
          gh run download 41443217086 -n phase34-flood-full-noaa-county-date-impact -D audit_inputs/phase36/phase34
          gh run download 41445094273 -n phase35-noaa-feature-isolation -D audit_inputs/phase36/phase35
      - run: python analysis/phase36_noaa_report_intensity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase36-noaa-report-intensity
          path: audit_outputs/phase36/
