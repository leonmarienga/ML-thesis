name: NHC archived advisory as-of feasibility
on:
  push:
    branches: [experiment/nhc-asof-advisories-20261101]
    paths:
      - 'analysis/nhc_asof_advisory_features.py'
      - '.github/workflows/nhc-asof-advisory-features.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/nhc-asof-advisories-20261101
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn openpyxl requests beautifulsoup4 pyarrow
      - name: Audit timestamped NHC advisories on tropical FEMA records
        run: python analysis/nhc_asof_advisory_features.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhc-asof-advisory-audit
          path: audit_outputs/nhc_asof_advisories/
          retention-days: 90
