name: Probe NHC archived advisory structure
on:
  push:
    branches: [experiment/nhc-asof-advisories-20261101]
    paths: [analysis/_probe_nhc_archive_structure.py,.github/workflows/probe-nhc-archive.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/nhc-asof-advisories-20261101
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python analysis/_probe_nhc_archive_structure.py
