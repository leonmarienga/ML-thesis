name: EAGLE-I hurricane outage audit

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/eaglei_hurricane_audit.py"
      - ".github/workflows/eaglei-hurricane-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl
      - name: Run EAGLE-I audit
        run: python analysis/eaglei_hurricane_audit.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eaglei-hurricane-audit
          path: audit_outputs/eaglei_hurricane/
