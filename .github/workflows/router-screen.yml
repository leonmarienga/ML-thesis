name: Router separability screen

on:
  push:
    branches:
      - experiment/mission-composition-20260829
    paths:
      - 'global_router_pairwise_fullfeature_screen.py'
      - 'ihp_nonfinancial_router_experiment.py'
      - 'declared_population_exposure_router_experiment.py'
      - '.github/workflows/router-screen.yml'
  workflow_dispatch:

jobs:
  router-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl scikit-learn catboost
      - name: Restore frozen MissionAssignments snapshot
        uses: actions/cache@v4
        with:
          path: mission_composition_results/MissionAssignments_v2.jsonl
          key: mission-assignments-openfema-snapshot-20260901-v1
      - name: Run full-feature pairwise screen
        run: python global_router_pairwise_fullfeature_screen.py
      - name: Run nonfinancial IHP impact screen
        run: python ihp_nonfinancial_router_experiment.py
      - name: Run declared population exposure screen
        run: python declared_population_exposure_router_experiment.py
      - name: Upload pairwise screen
        uses: actions/upload-artifact@v4
        with:
          name: global-router-pairwise-fullfeature-results
          path: global_router_pairwise_fullfeature_results/
          retention-days: 30
      - name: Upload IHP impact screen
        uses: actions/upload-artifact@v4
        with:
          name: ihp-nonfinancial-router-results
          path: ihp_nonfinancial_router_results/
          retention-days: 30
      - name: Upload declared population exposure screen
        uses: actions/upload-artifact@v4
        with:
          name: declared-population-exposure-router-results
          path: declared_population_exposure_router_results/
          retention-days: 30
