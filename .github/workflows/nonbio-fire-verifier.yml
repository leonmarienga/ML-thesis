name: Nonbio fire verifier

on:
  push:
    branches:
      - nonbiological-fire-verifier
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl pyarrow
      - name: Run fire verifier audit
        run: python analysis/nonbio_fire_verifier.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nonbio-fire-verifier
          path: audit_outputs/nonbio_fire_verifier/
