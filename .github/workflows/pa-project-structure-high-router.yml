name: PA project-structure high router

on:
  push:
    branches:
      - experiment/mission-composition-20260829
    paths:
      - 'pa_project_structure_high_router_experiment.py'
      - '.github/workflows/pa-project-structure-high-router.yml'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl scikit-learn
      - name: Run nonfinancial PA project-structure screen
        run: python pa_project_structure_high_router_experiment.py
      - name: Upload PA project-structure results
        uses: actions/upload-artifact@v4
        with:
          name: pa-project-structure-high-router-results
          path: pa_project_structure_high_router_results/
          retention-days: 30
