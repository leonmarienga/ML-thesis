name: Nonbio 830 six-band specialist stack

on:
  push:
    branches: [nonbiological-fire-verifier]
    paths:
      - 'analysis/nonbio_830_six_band_specialist_stack.py'
      - '.github/workflows/nonbio-830-six-band-specialist-stack.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier

      - name: Download accepted 830 artifact
        run: |
          mkdir -p audit_inputs/post830_six_band_specialists/accepted
          gh run download 34701792537 \
            -n nonbio-829-hurricane-amendment-floor \
            -D audit_inputs/post830_six_band_specialists/accepted

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas openpyxl scikit-learn numpy

      - name: Run six-band specialist stack
        run: python analysis/nonbio_830_six_band_specialist_stack.py

      - uses: actions/upload-artifact@v4
        with:
          name: nonbio-830-six-band-specialist-stack
          path: audit_outputs/nonbio_830_six_band_specialist_stack/
