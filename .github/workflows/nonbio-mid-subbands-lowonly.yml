name: Nonbio fast low subband audit
on:
  push:
    branches: [nonbiological-fire-verifier]
    paths:
      - "analysis/nonbio_mid_subbands_lowonly.py"
      - ".github/workflows/nonbio-mid-subbands-lowonly.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn requests openpyxl duckdb
      - run: python analysis/nonbio_mid_subbands_lowonly.py
      - uses: actions/upload-artifact@v4
        with:
          name: nonbio-mid-subbands-lowonly
          path: audit_outputs/nonbio_mid_subbands_lowonly/
