name: Flood 87 NOAA-USGS spatial screen
on:
  push:
    branches: [experiment/flood-hurricane-physical-20261101]
    paths: ['analysis/flood_87_geospatial_gauge_screen.py','.github/workflows/flood-87-geospatial-screen.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: experiment/flood-hurricane-physical-20261101}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy requests openpyxl
      - run: |
          mkdir -p audit_inputs/flood_geo_screen
          gh run download 41326254945 -n county-exposure-hazard-pilot -D audit_inputs/flood_geo_screen
          gh run download 34017327286 -n external-severity-ablation -D audit_inputs/flood_geo_screen
      - run: python analysis/flood_87_geospatial_gauge_screen.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flood-87-geospatial-gauge-screen
          path: audit_outputs/flood_geo_screen/
          retention-days: 90
