name: All hurricane EAGLE-I features

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/eaglei_all_hurricanes.py"
      - ".github/workflows/eaglei-all-hurricanes.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl duckdb
      - name: Build all-hurricane EAGLE-I features
        run: python analysis/eaglei_all_hurricanes.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-hurricane-eaglei-features
          path: audit_outputs/eaglei_high_hurricanes/
