name: Nonbio 824 Flood agency ESF rescue

on:
  push:
    branches:
      - nonbiological-fire-verifier
    paths:
      - "analysis/nonbio_824_flood_agency_esf_rescue.py"
      - ".github/workflows/nonbio-824-flood-agency-esf-rescue.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nonbiological-fire-verifier
      - name: Download accepted 824 artifact
        run: |
          mkdir -p audit_inputs/post824_flood_agency_esf/accepted
          gh run download 34695512143 \
            -n nonbio-823-earthquake-active-response-rescue \
            -D audit_inputs/post824_flood_agency_esf/accepted
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy scipy scikit-learn requests openpyxl duckdb
      - name: Run post-824 Flood agency ESF rescue audit
        run: python analysis/nonbio_824_flood_agency_esf_rescue.py
      - uses: actions/upload-artifact@v4
        with:
          name: nonbio-824-flood-agency-esf-rescue
          path: audit_outputs/nonbio_824_flood_agency_esf_rescue/
