name: Phase28 NASA OPERA DSWx flood CMR feasibility
on:
  push:
    branches: [experiment/flood-hurricane-physical-20261101]
    paths: ['analysis/phase28_nasa_opera_cmr_raster_access.py','.github/workflows/phase28-opera-cmr-feasibility.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: experiment/flood-hurricane-physical-20261101}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy requests openpyxl
      - run: |
          mkdir -p audit_inputs/dswx28
          gh run download 41410421735 -n daymet-all-87-flood-rainfall -D audit_inputs/dswx28
      - run: python analysis/phase28_nasa_opera_cmr_raster_access.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase28-opera-cmr-feasibility
          path: audit_outputs/dswx28/
          retention-days: 90
