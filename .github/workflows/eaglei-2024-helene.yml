name: EAGLE-I 2024 Helene diagnostic

on:
  push:
    branches:
      - external-severity-ablation
    paths:
      - "analysis/eaglei_2024_diagnostic.py"
      - ".github/workflows/eaglei-2024-helene.yml"
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: external-severity-ablation

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl

      - name: Run 2024 EAGLE-I Helene diagnostic
        run: python analysis/eaglei_2024_diagnostic.py

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: eaglei-2024-helene
          path: audit_outputs/eaglei_2024/
