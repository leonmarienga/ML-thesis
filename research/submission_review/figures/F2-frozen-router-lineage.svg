<svg xmlns="http://www.w3.org/2000/svg" width="940" height="610" viewBox="0 0 940 610" role="img" aria-labelledby="title desc">
<title id="title">Frozen six-band routing and amount-stack lineage</title><desc id="desc">Archived outputs pass from a shared historical six-band router to band-specific dollar estimators. Accepted low-band overlays and the research-only mid-band overlay do not change routing.</desc>
